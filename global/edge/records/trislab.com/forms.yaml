# The sender domain of the form handler (trislab-worker-form-handler), which
# sends the sites' form submissions from obrazec@forms.trislab.com through
# Resend, in the EU region. A domain of its own, so form mail can't harm the
# reputation of trislab.com's mail. forms.trislab.com itself is the production
# Worker's Custom Domain (workers.tf), so no record here may have that name.
# The CNAMEs point at Resend's sending infrastructure (forge.rmta.net) and stay
# DNS-only.
