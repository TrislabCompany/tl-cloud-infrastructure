# The records of astragroup.si, from NeoServ's zone export of 2026-11-16
# (ns33/ns34.neoserv.si), checked against ns33.neoserv.si and cleaned up. The
# site has moved from NeoServ's web hosting 152.89.234.70 to Pages. The mail
# stays on NeoServ's mail server 152.89.235.115 (eh3.neoserv.si), which has its
# own certificates for mail and webmail. The hosting's names are DNS-only.
#
# Not copied from NeoServ:
# - whm and webdisk: WHM isn't open to a shared-hosting account, and WebDisk
#   isn't used.
# - The 19 names under mail.astragroup.si (www.mail, cpanel.mail, its SPF, DKIM,
#   autodiscover and CalDAV/CardDAV): cPanel made them for a subdomain "mail" on
#   the web hosting. No mail uses @mail.astragroup.si; mail.astragroup.si is
#   only the mail server's name.
# - _acme-challenge and _cpanel-dcv-test-record, which cPanel AutoSSL writes for
#   each certificate it orders.
# Changed: the SPF record. NeoServ's include covers 152.89.232.0/22, so the
# ip4, a and mx terms were already in it, and a would let the apex's address
# (Cloudflare, then Pages) send mail. A DMARC record is added; NeoServ had none.

# The site is the production of the Pages site
# astragroup-website-corporate-site: its apex record comes from
# catalog/products.yaml (pages.tf). www and production only carry the
# redirects to astragroup.si in catalog/domains.yaml.
www: { name: www.astragroup.si, type: CNAME, content: astragroup.si, proxied: true }
production: { name: production.astragroup.si, type: CNAME, content: astragroup.si, proxied: true }

# The web hosting.
ftp: { name: ftp.astragroup.si, type: A, content: 152.89.234.70 }
cpanel: { name: cpanel.astragroup.si, type: A, content: 152.89.234.70 }

# Mail at NeoServ.
mx: { name: astragroup.si, type: MX, priority: 0, content: mail.astragroup.si }
mail: { name: mail.astragroup.si, type: A, content: 152.89.235.115 }
webmail: { name: webmail.astragroup.si, type: A, content: 152.89.235.115 }
spf: { name: astragroup.si, type: TXT, content: "v=spf1 include:_spf.mail-neoserv.si ~all" }
dmarc: { name: _dmarc.astragroup.si, type: TXT, content: "v=DMARC1; p=none" }
dkim-default: { name: default._domainkey.astragroup.si, type: TXT, content: "v=DKIM1; k=rsa; ;" }

# Calendars and contacts (cPanel groupware) on the mail server.
cpcalendars: { name: cpcalendars.astragroup.si, type: A, content: 152.89.235.115 }
cpcontacts: { name: cpcontacts.astragroup.si, type: A, content: 152.89.235.115 }
