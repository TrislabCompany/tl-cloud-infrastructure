# The records astragroup.si held at NeoServ (ns33/ns34.neoserv.si) before
# Cloudflare, from NeoServ's zone export of 2026-11-16, checked against
# ns33.neoserv.si. The site is on NeoServ's shared hosting 152.89.234.70 and its
# mail on 152.89.235.115. The site has a valid certificate for the domain and
# its subdomains, so its web names are proxied; the rest stay as NeoServ serves
# them. NeoServ publishes no DMARC.
#
# Not copied: _acme-challenge and _cpanel-dcv-test-record, which cPanel AutoSSL
# writes for each certificate it orders. Once the zone is on Cloudflare, AutoSSL
# can't write them, and it validates names over HTTP instead.

# The site and the hosting.
apex: { name: astragroup.si, type: A, content: 152.89.234.70, proxied: true }
www: { name: www.astragroup.si, type: CNAME, content: astragroup.si, proxied: true }
ftp: { name: ftp.astragroup.si, type: A, content: 152.89.234.70 }
cpanel: { name: cpanel.astragroup.si, type: A, content: 152.89.234.70 }
whm: { name: whm.astragroup.si, type: A, content: 152.89.234.70 }
webdisk: { name: webdisk.astragroup.si, type: A, content: 152.89.234.70 }

# Mail at NeoServ.
mx: { name: astragroup.si, type: MX, priority: 0, content: mail.astragroup.si }
mail: { name: mail.astragroup.si, type: A, content: 152.89.235.115 }
webmail: { name: webmail.astragroup.si, type: A, content: 152.89.235.115 }
spf: { name: astragroup.si, type: TXT, content: "v=spf1 +a +mx +ip4:152.89.234.70 include:_spf.mail-neoserv.si +ip4:152.89.234.74 +ip4:152.89.234.250 ~all" }
spf-mail: { name: mail.astragroup.si, type: TXT, content: "v=spf1 +a +mx +ip4:152.89.234.70 include:_spf.mail-neoserv.si +ip4:152.89.234.74 +ip4:152.89.234.250 ~all" }
dkim-default: { name: default._domainkey.astragroup.si, type: TXT, content: "v=DKIM1; k=rsa; ;" }
dkim-default-mail: { name: default._domainkey.mail.astragroup.si, type: TXT, content: "v=DKIM1; k=rsa; ;" }

# Mail client set-up and groupware (cPanel).
cpcalendars: { name: cpcalendars.astragroup.si, type: A, content: 152.89.235.115 }
cpcontacts: { name: cpcontacts.astragroup.si, type: A, content: 152.89.235.115 }

# The names cPanel made for its subdomain mail.astragroup.si. www.mail has a
# valid certificate but serves no site, so it stays DNS-only like the rest.
# NeoServ's SRV records point at astragroup.si. That name is proxied here, and
# Cloudflare doesn't pass the DAV ports 2079 and 2080, so they point at
# webdisk.astragroup.si instead: the same host and the same cPanel DAV service,
# DNS-only, and covered by the certificate.
www-mail: { name: www.mail.astragroup.si, type: A, content: 152.89.234.70 }
autodiscover-mail: { name: autodiscover.mail.astragroup.si, type: A, content: 152.89.234.70 }
autoconfig-mail: { name: autoconfig.mail.astragroup.si, type: A, content: 152.89.234.70 }
cpanel-mail: { name: cpanel.mail.astragroup.si, type: A, content: 152.89.234.70 }
whm-mail: { name: whm.mail.astragroup.si, type: A, content: 152.89.234.70 }
webdisk-mail: { name: webdisk.mail.astragroup.si, type: A, content: 152.89.234.70 }
webmail-mail: { name: webmail.mail.astragroup.si, type: A, content: 152.89.235.115 }
cpcalendars-mail: { name: cpcalendars.mail.astragroup.si, type: A, content: 152.89.234.70 }
cpcontacts-mail: { name: cpcontacts.mail.astragroup.si, type: A, content: 152.89.234.70 }
srv-autodiscover-mail: { name: _autodiscover._tcp.mail.astragroup.si, type: SRV, priority: 0, data: { weight: 0, port: 443, target: cpanelemaildiscovery.cpanel.net } }
srv-caldav-mail: { name: _caldav._tcp.mail.astragroup.si, type: SRV, priority: 0, data: { weight: 0, port: 2079, target: webdisk.astragroup.si } }
srv-caldavs-mail: { name: _caldavs._tcp.mail.astragroup.si, type: SRV, priority: 0, data: { weight: 0, port: 2080, target: webdisk.astragroup.si } }
srv-carddav-mail: { name: _carddav._tcp.mail.astragroup.si, type: SRV, priority: 0, data: { weight: 0, port: 2079, target: webdisk.astragroup.si } }
srv-carddavs-mail: { name: _carddavs._tcp.mail.astragroup.si, type: SRV, priority: 0, data: { weight: 0, port: 2080, target: webdisk.astragroup.si } }
caldav-path-mail: { name: _caldav._tcp.mail.astragroup.si, type: TXT, content: "path=/" }
caldavs-path-mail: { name: _caldavs._tcp.mail.astragroup.si, type: TXT, content: "path=/" }
carddav-path-mail: { name: _carddav._tcp.mail.astragroup.si, type: TXT, content: "path=/" }
carddavs-path-mail: { name: _carddavs._tcp.mail.astragroup.si, type: TXT, content: "path=/" }
