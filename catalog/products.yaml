# Tenants and their products (07 section 9 and 11). A tenant is Trislab itself
# or a client; a product has one repository and one domain, and its
# environments are hostnames on that domain. An entry is added by the PR that
# onboards the tenant or product, and never deleted: offboarding sets
# state: retired on a tenant, state: archived on a product, so a code is never
# reused and a repository is archived, not deleted.
#
# tenants[]
#   slug      the tenant's id; the Customer tag and the group names use it
#   code      2-3 letters, never reused; required for every tenant but trislab,
#             which is the platform's own owner (its stamps use shr)
#   state     active | retired
#   products  the tenant's products, [] while it has none
#
# products[] (the slug is unique within its tenant)
#   slug        the product's id
#   code        2-3 letters, never reused; only needed when a stamp deploys the product
#   repo        <tenant>-<website|webapp|saas>-<slug>; global/github creates it from its template
#   template    tl-template-website | tl-template-webapp | tl-template-saas
#   maintainers GitHub user names of the team <tenant>-<slug>
#   state       active | archived (+ archived_on)
#   domain      a domain of catalog/domains.yaml, owned by the same tenant
#   environments  Cloudflare Pages environments, for a tl-template-website repository
#               that no stamp deploys from. global/edge creates the Pages project,
#               named after the repository, and for each environment its custom
#               hostname (the domain or one label below it), a proxied CNAME to the
#               Pages branch of the same name (production is the project's
#               production branch) and an Access application unless access: public.
#               global/github creates the repository's GitHub Environment of the
#               same name, with the deploy variables and the secret
#               CLOUDFLARE_API_TOKEN. access: public is allowed on production only.
#               Deleting an environment deletes its hostname, record, Access
#               application and GitHub Environment; deleting the product's
#               environments also deletes the project and its token.
#               web_analytics: true (production only) creates a Cloudflare Web
#               Analytics site, turnstile: true a Turnstile widget for a form
#               (ADR 0060); both are off unless set.
tenants:
  - slug: trislab
    state: active
    products:
      - slug: corporate-site
        code: web
        repo: trislab-website-corporate-site
        template: tl-template-website
        maintainers: [tl-janskof]
        state: active
        domain: trislab.com
        environments:
          - { name: dev, hostname: dev-corporate-site.trislab.com }
          - { name: staging, hostname: staging-corporate-site.trislab.com }
          - { name: production, hostname: trislab.com, access: public }
      - slug: dragonja
        repo: trislab-website-dragonja
        template: tl-template-website
        maintainers: [tl-janskof]
        state: active
        domain: dragonja.si
        environments:
          - { name: dev, hostname: dev.dragonja.si }
          - { name: staging, hostname: staging.dragonja.si }
          - { name: production, hostname: dragonja.si, access: public }
  - slug: dragonja
    code: dra
    state: retired             # Trislab publishes dragonja.si itself, as its product dragonja
    products: []
  - slug: juskoski
    code: jus
    state: active
    products: []
  - slug: ldistragracisce
    code: ldg
    state: active
    products: []
  - slug: spds
    code: spd
    state: active
    products: []
