# Tenants and their products (07 section 9 and 11). A tenant is Trislab itself
# or a client; a product has one repository and one domain, and its
# environments are hostnames on that domain. An entry is added by the PR that
# onboards the tenant or product, and never deleted: offboarding sets
# state: retired on a tenant, state: archived on a product, so a code is never
# reused and a repository is archived, not deleted.
#
# tenants[]
#   slug      the tenant's id; the Customer tag and the group names use it
#   code      2-3 letters, never reused; required for every tenant but trislab,
#             which is the platform's own owner (its stamps use shr)
#   state     active | retired
#   products  the tenant's products, [] while it has none
#
# products[] (the slug is unique within its tenant)
#   slug        the product's id
#   code        2-3 letters, never reused; only needed when a stamp deploys the product
#   repo        <tenant>-<website|webapp|saas>-<slug>; global/github creates it from its template.
#               A shared service on Cloudflare Workers is <tenant>-worker-<slug>
#   template    tl-template-website | tl-product-webapp | tl-product-saas | none
#               (none: only for a worker, until tl-template-worker exists; an empty
#               repository with a first commit, which its team fills)
#   maintainers GitHub user names of the team <tenant>-<slug>
#   state       active | archived (+ archived_on)
#   domain      a domain of catalog/domains.yaml, owned by the same tenant
#   forms       true on the one worker that is the sites' form endpoint (D-32):
#               global/github writes the Turnstile secret of every site environment
#               with turnstile: true into its Environment of the same name, as
#               TURNSTILE_SECRET_<REPO>, and gives each such site environment the
#               worker's address as PUBLIC_FORMS_URL. Optional, a worker only
#   environments  For a worker: { name, hostname } per environment, nothing else.
#               global/edge creates the Worker <name>-<product>-<tenant> (the
#               repository's workflows deploy its code with wrangler) and its
#               hostname as a Workers Custom Domain, always public: browsers post
#               to it from the sites. global/github creates the GitHub Environment
#               of the same name, with CLOUDFLARE_ACCOUNT_ID, WORKER_NAME and
#               WORKER_URL and the secret CLOUDFLARE_API_TOKEN (Workers Scripts
#               Write). Otherwise, Cloudflare Pages environments, for a
#               tl-template-website repository that no stamp deploys from. global/edge creates the Pages project,
#               named after the repository, and for each environment its custom
#               hostname (the domain or one label below it), a proxied CNAME to the
#               Pages branch of the same name (production is the project's
#               production branch) and an Access application unless access: public.
#               global/github creates the repository's GitHub Environment of the
#               same name, with the deploy variables and the secret
#               CLOUDFLARE_API_TOKEN. access: public is allowed on production only.
#               Deleting an environment deletes its hostname, record, Access
#               application and GitHub Environment; deleting the product's
#               environments also deletes the project and its token.
#               web_analytics: true (production only) creates a Cloudflare Web
#               Analytics site, turnstile: true a Turnstile widget for a form
#               (ADR 0060); both are off unless set.
tenants:
  - slug: trislab
    state: active
    products:
      - slug: corporate-site
        code: web
        repo: trislab-website-corporate-site
        template: tl-template-website
        maintainers: [tl-janskof]
        state: active
        domain: trislab.com
        environments:
          - { name: dev, hostname: dev-corporate-site.trislab.com }
          - { name: staging, hostname: staging-corporate-site.trislab.com }
          - { name: production, hostname: trislab.com, access: public }
      - slug: dragonja
        repo: trislab-website-dragonja
        template: tl-template-website
        maintainers: [tl-janskof]
        state: active
        domain: dragonja.si
        environments:
          - { name: dev, hostname: dev.dragonja.si }
          - { name: staging, hostname: staging.dragonja.si }
          - { name: production, hostname: dragonja.si, access: public }
      - slug: form-handler     # the shared form Worker of the sites on Pages (D-14, D-32)
        repo: trislab-worker-form-handler
        template: none
        maintainers: [tl-janskof]
        state: active
        domain: trislab.com
        forms: true
        environments:
          - { name: dev, hostname: forms-dev.trislab.com }
          - { name: staging, hostname: forms-staging.trislab.com }
          - { name: production, hostname: forms.trislab.com }
  - slug: astragroup
    code: ast
    state: active
    products:
      - slug: corporate-site
        repo: astragroup-website-corporate-site
        template: tl-template-website
        maintainers: [tl-janskof]
        state: active
        domain: astragroup.si
        environments:
          - { name: dev, hostname: dev.astragroup.si }
          - { name: staging, hostname: staging.astragroup.si }
          - { name: production, hostname: astragroup.si, access: public, web_analytics: true }
      - slug: strehanakljuc
        repo: astragroup-website-strehanakljuc
        template: tl-template-website
        maintainers: [tl-janskof]
        state: active
        domain: strehanakljuc.si
        environments:
          - { name: dev, hostname: dev.strehanakljuc.si, turnstile: true }
          - { name: staging, hostname: staging.strehanakljuc.si, turnstile: true }
          - { name: production, hostname: production.strehanakljuc.si, web_analytics: true, turnstile: true }   # strehanakljuc.si at the cutover
      - slug: fasadanakljuc
        repo: astragroup-website-fasadanakljuc
        template: tl-template-website
        maintainers: [tl-janskof]
        state: active
        domain: fasadanakljuc.si
        environments:
          - { name: dev, hostname: dev.fasadanakljuc.si, turnstile: true }
          - { name: staging, hostname: staging.fasadanakljuc.si, turnstile: true }
          - { name: production, hostname: production.fasadanakljuc.si, web_analytics: true, turnstile: true }   # fasadanakljuc.si at the cutover
  - slug: dragonja
    code: dra
    state: retired             # Trislab publishes dragonja.si itself, as its product dragonja
    products: []
  - slug: juskoski
    code: jus
    state: active
    products: []
  - slug: ldistragracisce
    code: ldg
    state: active
    products:
      - slug: corporate-site
        repo: ldistragracisce-website-corporate-site
        template: tl-template-website
        maintainers: [tl-janskof]
        state: active
        domain: ldistragracisce.si
        environments:
          - { name: dev, hostname: dev.ldistragracisce.si }
          - { name: staging, hostname: staging.ldistragracisce.si }
          - { name: production, hostname: ldistragracisce.si, access: public, web_analytics: true }
  - slug: spds
    code: spd
    state: active
    products: []
