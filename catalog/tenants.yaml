# Domains and the tenants on each stamp (07 section 2). global/edge creates one
# Cloudflare zone per domain. A tenant is added by the PR that puts it on a
# stamp.
domains:
  - name: trislab.com
    owner: trislab
    waf_rate_limit: true             # the rate limit stays without stamps (07 section 2.1)
    redirects:
      - { from: www.trislab.com, to: trislab.com }
  - name: dragonja.si
    owner: dragonja
  - name: juskoski.si
    owner: juskoski
  - name: ldistragracisce.si
    owner: ldistragracisce
  - name: spds.si
    owner: spds

tenants:
  - name: corporate-site
    customer: trislab
    stamp: products-prod-neu/corporate-site
    hostnames:
      - { fqdn: prod-corporate-site.trislab.com, app: web, access: protected }
