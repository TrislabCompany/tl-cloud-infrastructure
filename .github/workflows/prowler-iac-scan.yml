name: Prowler IaC Scan

on:
  pull_request:
    paths:
      - 'shared-infrastructure/**'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  prowler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: prowler-cloud/prowler@73ae2eb1947a0912a05010a296f469bfa55ebe76 # 5.42.0
        with:
          provider: iac
          output-formats: sarif json-ocsf
          upload-sarif: true

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@4bd7200e1f146b1c937cae12d258b50f41a53cf8 # v4.38.0
        with:
          sarif_file: output
