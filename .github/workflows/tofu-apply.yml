# .github/workflows/tofu-apply.yml
#
# Runs once a PR touching shared-infrastructure/{azure,gcp} merges to main.
# Deliberately never checks out or references the PR's source branch — this repo
# deletes branches on merge, which is exactly what made Digger's apply (comment-
# or merge-triggered) fail. Instead this applies the exact plan artifact the
# matching tofu-plan.yml run already produced, located by the PR's head SHA
# (recorded on the run regardless of whether the branch still exists) and
# downloaded by run id (artifacts live on the run, not the branch).
#
# GCP temporarily disabled (matrix below is azure-only) — this pipeline
# currently can't produce a GCP plan artifact to apply at all (tofu-plan.yml's
# gcp leg is disabled for the same reason, see there), so this leg would have
# nothing to download regardless of whether the apply identity's own
# permissions are fine. Not independently verified broken/fixed — disabled as
# a consequence of tofu-plan.yml's gcp leg being disabled, not a new finding.
# See docs/spec/phase-04-cicd-enablement/step-05-drift-detection.md and
# docs/spec/phase-03-automation-identities/step-03-gcp-service-accounts.md.
name: Tofu Apply

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  id-token: write
  actions: read
  issues: write

jobs:
  apply:
    name: apply (${{ matrix.project }})
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: azure
            dir: shared-infrastructure/azure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Check for changes under ${{ matrix.dir }}
        id: changes
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.merge_commit_sha }}" -- "${{ matrix.dir }}" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Locate the matching plan run
        if: steps.changes.outputs.changed == 'true'
        id: find-run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'tofu-plan.yml',
              status: 'success',
              per_page: 100,
            });
            const headSha = context.payload.pull_request.head.sha;
            const match = data.workflow_runs.find(r => r.head_sha === headSha);
            if (!match) {
              core.setFailed(`No successful tofu-plan.yml run found for head SHA ${headSha} — merge only PRs whose plan check passed.`);
              return;
            }
            core.setOutput('run_id', match.id);

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.changes.outputs.changed == 'true'
        with:
          name: tfplan-${{ matrix.project }}-${{ github.event.pull_request.number }}
          path: ${{ matrix.dir }}
          run-id: ${{ steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        if: steps.changes.outputs.changed == 'true' && matrix.project == 'azure'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_APPLY }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.changes.outputs.changed == 'true' && matrix.project == 'gcp'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_APPLY }}

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: steps.changes.outputs.changed == 'true'
        with:
          tofu_version: 1.12.6

      - name: tofu apply
        if: steps.changes.outputs.changed == 'true'
        working-directory: ${{ matrix.dir }}
        env:
          TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_APPLY }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          tofu init -input=false
          tofu apply -input=false -auto-approve tfplan
