# .github/workflows/tofu-plan.yml
#
# Runs on every PR — no external orchestrator, no workflow_dispatch indirection.
# A native `pull_request` trigger gives GitHub's own OIDC token the subject shape
# its docs actually promise (`repo:<org>/<repo>:pull_request`), which is what the
# plan identity's federated credential / WIF binding trusts. See
# docs/spec/phase-04-cicd-enablement/.
#
# Deliberately NOT filtered with `on.pull_request.paths: shared-infrastructure/**`
# — branch protection requires the `plan (azure)`/`plan (gcp)` checks
# unconditionally to merge (Phase 4 Step 4), and a path-filtered trigger means
# this workflow, and therefore those checks, never even run on a PR that doesn't
# touch that path — leaving the check "Expected" forever and blocking every such
# PR from merging. The "Check for changes" step below does the path filtering
# instead, entirely inside the job, so the check itself always reports
# (skipping the actual plan work when irrelevant) rather than never reporting.
name: Tofu Plan

on:
  pull_request: {}

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: plan (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: azure
            dir: shared-infrastructure/azure
          - project: gcp
            dir: shared-infrastructure/gcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check for changes under ${{ matrix.dir }}
        id: changes
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
          if git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- "${{ matrix.dir }}" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        if: steps.changes.outputs.changed == 'true' && matrix.project == 'azure'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        if: steps.changes.outputs.changed == 'true' && matrix.project == 'gcp'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_PLAN }}

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        if: steps.changes.outputs.changed == 'true'
        with:
          tofu_version: 1.12.6

      - uses: infracost/actions/setup@fb736a8f219195d6efdca58682069b16fe1bc280 # v4.2.0
        if: steps.changes.outputs.changed == 'true'
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: tofu fmt/validate/plan
        if: steps.changes.outputs.changed == 'true'
        id: plan
        working-directory: ${{ matrix.dir }}
        env:
          TF_VAR_azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_gcp_project_id: ${{ vars.GCP_PROJECT_ID }}
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID_PLAN }}
          ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -o pipefail
          tofu fmt -check -diff
          tofu init -input=false
          tofu validate
          set +e
          tofu plan -input=false -out=tfplan -detailed-exitcode | tee plan.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Infracost breakdown
        if: steps.changes.outputs.changed == 'true'
        working-directory: ${{ matrix.dir }}
        run: infracost breakdown --path=. | tee infracost.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.changes.outputs.changed == 'true'
        with:
          name: tfplan-${{ matrix.project }}-${{ github.event.pull_request.number }}
          path: ${{ matrix.dir }}/tfplan
          retention-days: 7

      - name: Comment plan + cost on PR
        if: steps.changes.outputs.changed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = '${{ matrix.dir }}';
            const plan = fs.readFileSync(path.join(dir, 'plan.txt'), 'utf8');
            const cost = fs.readFileSync(path.join(dir, 'infracost.txt'), 'utf8');
            const marker = `<!-- tofu-plan:${{ matrix.project }} -->`;
            const body = `${marker}\n### Tofu Plan — \`${{ matrix.project }}\`\n<details><summary>Plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>\n\n<details><summary>Infracost</summary>\n\n\`\`\`\n${cost}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number, body });
            }

      - name: Fail on plan error
        if: steps.changes.outputs.changed == 'true' && steps.plan.outputs.exitcode == '1'
        run: exit 1
