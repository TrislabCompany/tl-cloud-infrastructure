# digger.yml (repo root)
# apply_requirements: [] on both projects — the default [mergeable] requirement can
# never be satisfied by on_commit_to_default's apply, since it only fires once the
# PR is already merged and closed (see #18).
projects:
  - name: shared-infrastructure-azure
    dir: shared-infrastructure/azure
    workflow: default
    apply_requirements: []

  - name: shared-infrastructure-gcp
    dir: shared-infrastructure/gcp
    workflow: default
    apply_requirements: []

workflows:
  default:
    plan:
      steps:
        - init
        - plan
        - run: infracost breakdown --path=. | tee -a $DIGGER_OUT
    apply:
      steps:
        - init
        - apply
    workflow_configuration:
      on_pull_request_pushed: ["digger plan"]
      on_pull_request_closed: ["digger unlock"]
      on_commit_to_default: ["digger apply"]
    disable_digger_apply_comment: true
    disable_digger_apply_status_check: true
