# digger.yml (repo root)
#
# Apply-on-merge (on_commit_to_default) doesn't work in this repo and can't be made
# to: Digger's apply — whether comment- or merge-triggered — still needs the PR's
# head branch to exist, and this repo deletes branches on merge (confirmed via
# diggerhq/digger#2243 — push-event handling was removed from Digger's backend, so
# on_commit_to_default is actually driven off the PR-merged event, which hits the
# same "branch not found after PR merge" failure comment-triggered apply hit on
# #13/#14). So: always run `digger apply` on an open PR and confirm it succeeds
# BEFORE merging — never after.
projects:
  - name: shared-infrastructure-azure
    dir: shared-infrastructure/azure
    workflow: default

  - name: shared-infrastructure-gcp
    dir: shared-infrastructure/gcp
    workflow: default

workflows:
  default:
    plan:
      steps:
        - init
        - plan
        - run: infracost breakdown --path=. | tee -a $DIGGER_OUT
    apply:
      steps:
        - init
        - apply
    workflow_configuration:
      on_pull_request_pushed: ["digger plan"]
      on_pull_request_closed: ["digger unlock"]

disable_digger_apply_comment: false
disable_digger_apply_status_check: false
